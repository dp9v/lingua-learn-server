openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/groups/{groupId}/words:
    get:
      tags:
      - groups-controller
      operationId: getWordsInGroup
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupWithWords"
    put:
      tags:
      - groups-controller
      operationId: addWords
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWordsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/groups:
    get:
      tags:
      - groups-controller
      operationId: getGroupsForUser
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      tags:
      - groups-controller
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /api/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/words/random:
    get:
      tags:
      - words-controller
      operationId: getRandomWords
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/GetRandomWordsRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRandomWordsResponse"
  /api/languages:
    get:
      tags:
      - languages-controller
      operationId: getAvailableLanguages
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageDto"
  /api/health:
    get:
      tags:
      - health-controller
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/auth/me:
    get:
      tags:
      - auth-controller
      operationId: getUserName
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
components:
  schemas:
    CreateWordsRequest:
      type: object
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/WordPairFull"
    Word:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        language:
          type: string
          enum:
          - RU
          - EN
          - CZ
    WordPairFull:
      type: object
      properties:
        id:
          type: integer
          format: int64
        from:
          $ref: "#/components/schemas/Word"
        to:
          $ref: "#/components/schemas/Word"
    Group:
      required:
      - description
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
        wordsCount:
          type: integer
          format: int64
    RegisterRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          maxLength: 2147483647
          minLength: 8
          type: string
        name:
          maxLength: 2147483647
          minLength: 2
          type: string
        surname:
          maxLength: 2147483647
          minLength: 2
          type: string
    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        password:
          type: string
        name:
          type: string
        surname:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    GetRandomWordsRequest:
      required:
      - groups
      type: object
      properties:
        groups:
          maxItems: 25
          minItems: 0
          type: array
          items:
            type: integer
            format: int64
        count:
          maximum: 30
          type: integer
          format: int32
    GetRandomWordsResponse:
      type: object
      properties:
        words:
          type: array
          items:
            $ref: "#/components/schemas/WordPairFull"
    LanguageDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    GroupWithWords:
      type: object
      properties:
        group:
          $ref: "#/components/schemas/Group"
        words:
          type: array
          items:
            $ref: "#/components/schemas/WordPairFull"
    MeResponse:
      type: object
      properties:
        name:
          type: string
