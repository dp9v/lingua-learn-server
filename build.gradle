plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.6'
	id "com.github.node-gradle.node" version "3.5.0"
}

group = 'com.cp9v'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'

	testRuntimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
	// Pass external DB connection string to test JVM (if set)
	environment 'JDBC_CONNECTION_STRING', System.getenv('JDBC_CONNECTION_STRING')
}

node {
	version = '22.15.0'
	download = true
	workDir = file("${project.projectDir}/ui/nodejs")
	npmWorkDir = file("${project.projectDir}/ui/npm")
	nodeModulesDir = file("${project.projectDir}/ui")
}

tasks.register('uiCleanBuild', Delete) {
	delete(fileTree("${project.projectDir}/src/main/resources/static"))
}

tasks.register('uiNpmInstall', NpmTask) {
	description = " read package.json and install all jars"
	workingDir = file("${project.projectDir}/ui")
	args = ["install"]
}

tasks.register('uiNpmBuild', NpmTask) {
	dependsOn 'uiNpmInstall'
	description = "Builds application for your frontend "
	workingDir = file("${project.projectDir}/ui")
	args = ["run", "build"]
}

tasks.register('uiCopyStatic', Copy) {
	dependsOn 'uiNpmBuild', 'uiCleanBuild'
	from "${project.projectDir}/ui/dist"
	into "${project.projectDir}/src/main/resources/static"
	eachFile { file ->
		println file.sourcePath
		println file.path
	}
}
