plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.6'
	id "com.github.node-gradle.node" version "3.5.0"
}

group = 'com.cp9v'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

node {
	download = false
	workDir = file("${project.projectDir}/ui/nodejs")
	// NPM work directory
	npmWorkDir = file("${project.projectDir}/ui/npm")
	// node modules directory
	nodeModulesDir = file("${project.projectDir}/ui")
}

tasks.register('appNpmInstall', NpmTask) {
	description = " read package.json and install all jars"
	workingDir = file("${project.projectDir}/ui")
	args = ["install", "-debug"]
}
tasks.register('appNpmBuild', NpmTask) {
	description = "Builds application for your frontend "
	workingDir = file("${project.projectDir}/ui")
	args = ["run", "build"]
}
tasks.register('copyToFrontend', Copy) {
	from "${project.projectDir}/ui/dist"
	into "${project.projectDir}/src/main/resources/static"
	eachFile { file ->
		println file.sourcePath
		println file.path
	}
}
