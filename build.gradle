buildscript {
	dependencies {
		classpath 'org.flywaydb:flyway-database-postgresql:10.17.0'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.flywaydb.flyway' version "10.17.0"
	id "com.github.node-gradle.node" version "3.5.0"
}

group = 'com.cp9v'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

flyway {
	url = System.getenv('JDBC_URL')
	user = System.getenv('JDBC_USER_NAME')
	password = System.getenv('JDBC_PASSWORD')
}

node {
	download = false
	workDir = file("${project.projectDir}/src/main/resources/fe/nodejs")
	// NPM work directory
	npmWorkDir = file("${project.projectDir}/src/main/resources/fe/npm")
	// node modules directory
	nodeModulesDir = file("${project.projectDir}/src/main/resources/fe")
}

tasks.register('appNpmInstall', NpmTask) {
	description = " read package.json and install all jars"
	workingDir = file("${project.projectDir}/src/main/resources/fe")
	args = ["install", "-debug"]
}
tasks.register('appNpmBuild', NpmTask) {
	description = "Builds application for your frontend "
	workingDir = file("${project.projectDir}/src/main/resources/fe")
	args = ["run", "build"]
}
tasks.register('copyToFrontend', Copy) {
	from "${project.projectDir}/src/main/resources/fe/dist"
	into "${project.projectDir}/src/main/resources/static"
	eachFile { file ->
		println file.sourcePath
		println file.path
	}
}
