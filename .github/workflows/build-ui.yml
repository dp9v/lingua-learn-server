name: Test UI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: 'npm'
          cache-dependency-path: app-ui/src/package-lock.json

      - name: 📦 Install dependencies
        working-directory: app-ui/src
        run: npm ci

      - name: 🧹 Run ESLint
        working-directory: app-ui/src
        run: npm run lint

      - name: 🎨 Check formatting with Prettier
        working-directory: app-ui/src
        run: npx prettier --check .

      - name: 🛠 Build frontend with Gradle
        run: ./gradlew :app-ui:uiNpmBuild :app-ui:uiCopyStatic --no-daemon --stacktrace

      - name: 🧪 Run frontend tests
        working-directory: app-ui/src
        run: npm test