name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'master'
      version:
        description: 'Docker image version (e.g. 1.0.0). If empty, current date/time will be used.'
        required: false
        default: ''
      environment:
        description: 'Spring profile to use (local, pi, etc.)'
        required: false
        default: 'local'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'master' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend
        run: ./gradlew uiCopyStatic

      - name: Build backend
        run: ./gradlew build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.CR_PAT }}

      - name: Set version tag
        id: version_tag
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            VERSION=$(date -u +"%Y%m%d-%H%M%S")
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ghcr.io/${{ secrets.USERNAME }}/lingua-learn-server
        run: |
          VERSION=${{ steps.version_tag.outputs.version }}
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest
