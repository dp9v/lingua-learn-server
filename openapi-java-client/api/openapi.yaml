openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- description: Generated server url
  url: http://localhost:8080
paths:
  /api/groups/{groupId}/words:
    get:
      operationId: getWordsInGroup
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GroupWithWords'
          description: OK
      tags:
      - groups-controller
      x-accepts:
      - '*/*'
    put:
      operationId: addWords
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWordsRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
          description: OK
      tags:
      - groups-controller
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/groups:
    get:
      operationId: getGroupsForUser
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/Group'
                type: array
          description: OK
      tags:
      - groups-controller
      x-accepts:
      - '*/*'
    post:
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                format: int64
                type: integer
          description: OK
      tags:
      - groups-controller
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
          description: OK
      tags:
      - auth-controller
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: OK
      tags:
      - auth-controller
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/words/random:
    get:
      operationId: getRandomWords
      parameters:
      - explode: true
        in: query
        name: request
        required: true
        schema:
          $ref: '#/components/schemas/GetRandomWordsRequest'
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GetRandomWordsResponse'
          description: OK
      tags:
      - words-controller
      x-accepts:
      - '*/*'
  /api/languages:
    get:
      operationId: getAvailableLanguages
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/LanguageDto'
                type: array
          description: OK
      tags:
      - languages-controller
      x-accepts:
      - '*/*'
  /api/health:
    get:
      operationId: healthCheck
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
          description: OK
      tags:
      - health-controller
      x-accepts:
      - '*/*'
  /api/auth/me:
    get:
      operationId: getUserName
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: OK
      tags:
      - auth-controller
      x-accepts:
      - '*/*'
components:
  schemas:
    CreateWordsRequest:
      example:
        pairs:
        - from:
            language: RU
            id: 5
            text: text
          id: 1
          to:
            language: RU
            id: 5
            text: text
        - from:
            language: RU
            id: 5
            text: text
          id: 1
          to:
            language: RU
            id: 5
            text: text
      properties:
        pairs:
          items:
            $ref: '#/components/schemas/WordPairFull'
          type: array
      type: object
    Word:
      example:
        language: RU
        id: 5
        text: text
      properties:
        id:
          format: int64
          type: integer
        text:
          type: string
        language:
          enum:
          - RU
          - EN
          - CZ
          type: string
      type: object
    WordPairFull:
      example:
        from:
          language: RU
          id: 5
          text: text
        id: 1
        to:
          language: RU
          id: 5
          text: text
      properties:
        id:
          format: int64
          type: integer
        from:
          $ref: '#/components/schemas/Word'
        to:
          $ref: '#/components/schemas/Word'
      type: object
    Group:
      example:
        wordsCount: 6
        name: name
        description: description
        isPublic: true
        id: 0
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
        wordsCount:
          format: int64
          type: integer
      required:
      - description
      - name
      type: object
    RegisterRequest:
      example:
        password: password
        surname: surname
        name: name
        email: email
      properties:
        email:
          type: string
        password:
          maxLength: 2147483647
          minLength: 8
          type: string
        name:
          maxLength: 2147483647
          minLength: 2
          type: string
        surname:
          maxLength: 2147483647
          minLength: 2
          type: string
      required:
      - email
      - password
      type: object
    UserDto:
      example:
        password: password
        surname: surname
        name: name
        id: 0
        email: email
      properties:
        id:
          format: int64
          type: integer
        email:
          type: string
        password:
          type: string
        name:
          type: string
        surname:
          type: string
      type: object
    LoginResponse:
      example:
        expiresAt: 2000-01-23T04:56:07.000+00:00
        token: token
      properties:
        token:
          type: string
        expiresAt:
          format: date-time
          type: string
      type: object
    GetRandomWordsRequest:
      properties:
        groups:
          items:
            format: int64
            type: integer
          maxItems: 25
          minItems: 0
          type: array
        count:
          format: int32
          maximum: 30
          type: integer
      required:
      - groups
      type: object
    GetRandomWordsResponse:
      example:
        words:
        - from:
            language: RU
            id: 5
            text: text
          id: 1
          to:
            language: RU
            id: 5
            text: text
        - from:
            language: RU
            id: 5
            text: text
          id: 1
          to:
            language: RU
            id: 5
            text: text
      properties:
        words:
          items:
            $ref: '#/components/schemas/WordPairFull'
          type: array
      type: object
    LanguageDto:
      example:
        code: code
        name: name
      properties:
        code:
          type: string
        name:
          type: string
      type: object
    GroupWithWords:
      example:
        words:
        - from:
            language: RU
            id: 5
            text: text
          id: 1
          to:
            language: RU
            id: 5
            text: text
        - from:
            language: RU
            id: 5
            text: text
          id: 1
          to:
            language: RU
            id: 5
            text: text
        group:
          wordsCount: 6
          name: name
          description: description
          isPublic: true
          id: 0
      properties:
        group:
          $ref: '#/components/schemas/Group'
        words:
          items:
            $ref: '#/components/schemas/WordPairFull'
          type: array
      type: object
    MeResponse:
      example:
        name: name
      properties:
        name:
          type: string
      type: object

